<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian for Parents — Parents AI Platform</title>
    <meta
      name="description"
      content="Family digital-safety, scam defense, QR inspection, call-timing protection, and consent-first Parents AI financial insights."
    />
    <meta property="og:title" content="Guardian for Parents — Parents AI Platform" />
    <meta
      property="og:description"
      content="Consent-first family safety, scam detection, QR intelligence, call timing watch, and Parents AI workspace."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.setAttribute('data-theme', 'dark');
          root.classList.add('dark');
          var fontMap = { sm: '14px', base: '16px', lg: '18px', xl: '20px' };
          var fs = localStorage.getItem('guardian_font_scale') || 'base';
          root.style.fontSize = fontMap[fs] || '16px';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#071525] text-[#F4F0E6] antialiased selection:bg-[#C6A15B]/30 selection:text-[#F4F0E6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
