services:
  - type: web
    name: guardian-for-parents
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://localhost,capacitor://localhost"
      - key: VITE_API_BASE_URL
        value: ""
      - key: VITE_APP_ENV
        value: production
